name: Check Totem Reference Drift
on:
  push:
    paths:
      - "data/totem-parity.json"
      - "data/reference-surface-map.json"
      - "scripts/check-totem-reference.mjs"
      - "scripts/validate-reference-surface.mjs"
      - ".github/workflows/reference-parity.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm audited TotemWorkspace baseline is current
        run: node scripts/check-totem-reference.mjs
      - name: Clone exact TotemWorkspace reference
        run: git clone --depth=1 --branch main https://github.com/Yunitrish006006/TotemWorkspace.git .reference/TotemWorkspace
      - name: Audit full reference file surface and required counterparts
        env:
          TOTEM_REFERENCE_ROOT: ${{ github.workspace }}/.reference/TotemWorkspace
        run: node scripts/validate-reference-surface.mjs
